version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next, React et leurs types évoluent ensemble.
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      dev-tooling:
        dependency-type: development
    ignore:
      # Les montées de version majeure se font à la main, après lecture des notes.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
