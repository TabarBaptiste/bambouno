name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule le run précédent de la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint + jsx-a11y strict)
        run: pnpm run lint
      - name: Types
        run: pnpm run typecheck
      - name: Tests unitaires
        run: pnpm test
      - name: Build de production
        run: pnpm run build

  e2e:
    name: E2E, accessibilité (axe WCAG 2.2 AA), responsive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  audit:
    name: Audit de sécurité des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Seules les dépendances livrées en production bloquent ; high et plus.
      - run: pnpm audit --prod --audit-level=high
